[build]
# https://docs.netlify.com/build/configure-builds/manage-dependencies/#node-js-and-javascript
# Node version set in .nvmrc
# JS dependencies must be listed in package.json
command = "./netlify_build.sh"
publish = "dist/"

# Redirect rules
# Splat redirect from /docs/ to /
# The site was served at allcontributors.org/docs/ before it moved to the root.
# Redirects for moved pages live in configs/redirects.config.ts.
[[redirects]]
  from = "/docs/*"
  to = "/:splat"
  status = 302
