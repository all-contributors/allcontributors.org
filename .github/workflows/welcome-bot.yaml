name: WelcomeBot

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] only comment on the PR without checking out anything
    branches: [main]
    types: [opened]

permissions: {}

jobs:
  welcome:
    name: Welcome First-Time Contributors
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      # Pinned to the head of the `zephyr` branch (v1.1.1+zephyr.6) without a version comment,
      # otherwise Renovate ignores the `+zephyr.6` build metadata and downgrades to the `v1.1.1` tag.
      - uses: zephyrproject-rtos/action-first-interaction@58853996b1ac504b8e0f6964301f369d2bb22e5c
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          pr-opened-message: |
            Hello! Thank you for opening your **first PR** to All Contributors! ✨

            Here’s what will happen next:

            1. Our GitHub bots will run to check your changes.
               If they spot any issues you will see some error messages on this PR.
               Don’t hesitate to ask any questions if you’re not sure what these mean!

            2. In a few minutes, you’ll be able to see a preview of your changes on Netlify 🤩

            3. One or more of our maintainers will take a look and may ask you to make changes.
               We try to be responsive, but don’t worry if this takes a few days.
